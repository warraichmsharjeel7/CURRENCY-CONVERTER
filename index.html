<!DOCTYPE html>
<html lang="ur" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="website icon"
      type="image/jpeg"
      href="https://cdn.shopify.com/app-store/listing_images/cf239c8711877a80b301350bc4d4a9ba/icon/CMW47cz0lu8CEAE=.jpg"
    />
    <title>Currency Converter</title>
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="card">
      <div class="header">
        <div class="icon-badge">
          <i class="fa-solid fa-coins"></i>
        </div>
        <h2>Currency Converter</h2>
      </div>

      <form>
        <div class="amount">
          <label>Enter Amount</label>
          <div class="input-box">
            <i class="fa-solid fa-money-bill-wave"></i>
            <input value="1" type="number" min="1" step="any" placeholder="100" />
          </div>
        </div>

        <div class="dropdown">
          <div class="from">
            <label>From</label>
            <div class="select-container">
              <img src="https://flagsapi.com/US/flat/64.png" alt="From Flag" />
              <select name="from"></select>
            </div>
          </div>

          <div class="swap-btn" id="swap-icon" title="Swap Currencies">
            <i class="fa-solid fa-arrow-right-arrow-left"></i>
          </div>

          <div class="to">
            <label>To</label>
            <div class="select-container">
              <img src="https://flagsapi.com/PK/flat/64.png" alt="To Flag" />
              <select name="to"></select>
            </div>
          </div>
        </div>

        <div class="msg">1 USD = 284.84 PKR</div>

        <button type="submit">
          <span>Get Exchange Rate</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
    </div>

    <script src="codes.js"></script>
    <script src="script.js"></script>
  </body>
</html>
